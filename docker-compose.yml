# Run `./scripts/setup.sh` rather than editing this by hand; it writes .env for you.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/setup.sh first}
      POSTGRES_DB: voicelab
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelab -d voicelab"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://voicelab:${POSTGRES_PASSWORD}@db:5432/voicelab
      VOICELAB_SECRET_KEY: ${VOICELAB_SECRET_KEY:?run ./scripts/setup.sh first}
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  dbdata:
